server:
  # 默认 8081: 本机 8080 常被其他应用占用(如 Steam web helper); 可用环境变量覆盖
  port: ${APR_SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: price-radar-backend
  # 数据库: 凭据经环境变量注入, 不落库(python/.env 同源); 运行前请设置 APR_MYSQL_PWD
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/agri_price_radar?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${APR_MYSQL_USER:root}
    password: ${APR_MYSQL_PWD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL; 生产 profile(application-prod.yml) 已关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 业务自定义配置
apr:
  jwt:
    # 生产必须用环境变量 APR_JWT_SECRET 覆盖(HS256 要求密钥 ≥32 字节)
    secret: ${APR_JWT_SECRET:agri-price-radar-dev-secret-key-please-override-in-prod}
    expire-minutes: ${APR_JWT_EXPIRE_MINUTES:120}
  collect:
    # 手动触发采集: 调用 Python 采集器(复用现有实现, 不在 Java 侧重写爬虫)
    python-exe: ${APR_PYTHON_EXE:python}
    script: ${APR_COLLECT_SCRIPT:python/collector/xinfadi.py}
    project-dir: ${APR_PROJECT_DIR:..}
    lookback-days: ${APR_COLLECT_LOOKBACK_DAYS:3}
    timeout-seconds: 600
  alert:
    # 预警评估定时任务(Java 侧, 与 Python 采集/预计算调度分工)
    cron: ${APR_ALERT_CRON:0 30 21 * * ?}

logging:
  charset:
    console: UTF-8
  level:
    root: info
    com.agri.priceradar: debug
