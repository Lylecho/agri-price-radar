server:
  # 默认 8081: 本机 8080 常被其他应用占用(如 Steam web helper); 可用环境变量覆盖
  port: ${APR_SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: price-radar-backend
  # 数据库: 凭据经环境变量注入, 不落库(python/.env 同源); 运行前请设置 APR_MYSQL_PWD
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/agri_price_radar?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${APR_MYSQL_USER:root}
    password: ${APR_MYSQL_PWD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL; 生产可注释
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  charset:
    console: UTF-8
  level:
    root: info
    com.agri.priceradar: debug
